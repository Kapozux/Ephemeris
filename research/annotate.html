<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标注工具（不是 Ephemeris）</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1e1e1c; --mute:#77736b; --line:#e2dfd8; --you:#eef3fb; --ai:#f4f2ec;
          --acc:#2f5fb3; --on:#fff; --warn:#a4561b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#212125; --ink:#e8e6e1; --mute:#9a968e; --line:#34343a; --you:#1f2a3b; --ai:#26262b;
            --acc:#7ea6ec; --on:#111; --warn:#e0a060; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  .an-top { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; z-index:1; }
  .an-top b { font-weight:600; }
  .an-tag { color:var(--warn); font-size:13px; }
  .an-bar { height:4px; background:var(--line); border-radius:2px; margin-top:8px; }
  .an-bar i { display:block; height:100%; background:var(--acc); border-radius:2px; }
  .an-main { max-width:820px; margin:0 auto; padding:16px; }
  .an-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .an-meta { color:var(--mute); font-size:13px; margin-bottom:10px; }
  .an-msg { border-radius:8px; padding:8px 12px; margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
  .an-msg.is-human { background:var(--you); }
  .an-msg.is-assistant { background:var(--ai); }
  .an-msg.is-ctx { opacity:.55; font-size:13px; max-height:7.5em; overflow-y:auto; }
  .an-msg.is-target { outline:2px solid var(--acc); }
  .an-who { font-size:12px; color:var(--mute); display:block; }
  .an-long { max-height:420px; overflow-y:auto; }
  .an-q { margin-top:16px; }
  .an-q p { margin:0 0 6px; font-weight:600; }
  .an-q small { display:block; color:var(--mute); font-weight:normal; margin:-4px 0 6px; }
  .an-opt { font:inherit; padding:7px 14px; margin:0 6px 6px 0; border:1px solid var(--line); border-radius:7px;
            background:var(--card); color:var(--ink); cursor:pointer; }
  .an-opt.is-on { background:var(--acc); color:var(--on); border-color:var(--acc); }
  .an-row { display:flex; gap:8px; justify-content:space-between; margin-top:18px; align-items:center; }
  .an-go { font:inherit; padding:8px 20px; border:0; border-radius:7px; background:var(--acc); color:var(--on); cursor:pointer; }
  .an-go:disabled { opacity:.4; cursor:default; }
  .an-undo { font:inherit; background:none; border:0; color:var(--mute); cursor:pointer; text-decoration:underline; }
  .an-done { text-align:center; padding:40px 16px; color:var(--mute); }
</style>
</head>
<body>
<div class="an-top">
  <b>标注工具</b> <span class="an-tag">· 研究版自检用，不是 Ephemeris · 标的结果只存在这台电脑</span>
  <div id="prog" class="an-meta" style="margin:4px 0 0"></div>
  <div class="an-bar"><i id="bar"></i></div>
</div>
<div class="an-main"><div id="box" class="an-card">读取中…</div></div>
<script>
const $ = s => document.querySelector(s);
const esc = t => (t || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const WHO = {human:'你', assistant:'AI'};
let cur = null, ans = {}, st = null;

function bubble(m, cls) {
  return `<div class="an-msg is-${m.role} ${cls||''}"><span class="an-who">${WHO[m.role] || m.role}</span>${esc(m.text)}</div>`;
}
function q(key, title, hint, opts) {
  return `<div class="an-q" data-k="${key}"><p>${title}</p>${hint ? `<small>${hint}</small>` : ''}` +
    opts.map(([v, t], i) => `<button class="an-opt" data-v="${v}">${i+1}. ${t}</button>`).join('') + '</div>';
}
function need() {
  if (cur.kind === 'msg') return cur.role === 'human' ? ['speaker', 'pasted'] : ['speaker'];
  return ['idea'];
}
function render() {
  const p = st.parts;
  $('#prog').textContent = `${st.done}/${st.total}　消息 ${p.msg[0]}/${p.msg[1]} · 对话 ${p.seg[0]}/${p.seg[1]} · 过几天重标 ${p.retest[0]}/${p.retest[1]}`;
  $('#bar').style.width = (100 * st.done / st.total) + '%';
  const undo = st.last ? '<button class="an-undo" id="undo">撤回上一条</button>' : '<span></span>';
  if (!cur) {
    const w = st.waiting === 'after' ? '先把前面的标完。' : st.waiting ? `重标的 ${p.retest[1]} 段 ${st.waiting} 以后才出现（隔几天再看，才看得出前后一不一致）。` : '';
    $('#box').innerHTML = `<div class="an-done">${w || '全部标完了，谢谢。'}</div><div class="an-row">${undo}</div>`;
  } else if (cur.kind === 'msg') {
    $('#box').innerHTML = `<div class="an-meta">第 2 项 · 一条消息 · ${cur.source} · ${cur.quarter} · ${cur.chars} 字（浅色的是前后各一条，只给上下文）</div>` +
      (cur.before ? bubble(cur.before, 'is-ctx') : '') +
      `<div class="an-long">${bubble(cur, 'is-target')}</div>` +
      (cur.after ? bubble(cur.after, 'is-ctx') : '') +
      q('speaker', `框起来这条标的是「${WHO[cur.role]}」说的，对吗？`, '', [['right','对'],['wrong','不对'],['unsure','看不出']]) +
      (cur.role === 'human' ? q('pasted', '这条里有没有贴进来的东西？', '不是你当场打的都算：AI 的原话、文章、日志、代码、别处复制的字。只有一小段也算「有」。',
        [['yes','有'],['no','没有'],['unsure','看不出']]) : '') +
      `<div class="an-row">${undo}<button class="an-go" id="go" disabled>下一条 ⏎</button></div>`;
  } else {
    const head = cur.kind === 'retest' ? '第 3 项 · 重标（之前标过，别回想，照现在的看法选）' : '第 3 项 · 一段对话';
    $('#box').innerHTML = `<div class="an-meta">${head} · ${cur.source} · ${cur.quarter} · 窗口前 ${cur.msgs.length} 条，每条最多 600 字（跟模型看到的一样）</div>` +
      cur.msgs.map(m => bubble(m)).join('') +
      q('idea', `话题：${esc(cur.topic)}。在这个话题上，你最后有没有采用某个决定或方案？有的话，是谁先提出来的？`,
        '只看这个话题，段里别的事不管。AI 先说、你后来同意的，算 AI 先提；你后来换个说法重复一遍也还算 AI。只是聊、没定下什么，选最后一个。',
        Object.entries(st.idea)) +
      `<div class="an-q"><small>导出里没有你上传的文件 / 截图 / 贴的长文，所以有时你只说「帮我看看」，AI 就开始讲内容。照页面上看得到的判；如果你记得这段传过东西，点一下：</small>` +
      `<button class="an-opt" id="hid">这段里有看不到的文件</button></div>` +
      `<div class="an-row">${undo}<button class="an-go" id="go" disabled>下一段 ⏎</button></div>`;
  }
  document.querySelectorAll('.an-q').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.an-opt'); if (!b) return;
    pick(g.dataset.k, b.dataset.v);
  }));
  $('#undo') && ($('#undo').onclick = () => post('/api/undo', {}));
  $('#go') && ($('#go').onclick = submit);
  $('#hid') && ($('#hid').onclick = () => { ans.hidden = !ans.hidden; $('#hid').classList.toggle('is-on', !!ans.hidden); });
  window.scrollTo(0, 0);
}
function pick(k, v) {
  ans[k] = v;
  document.querySelectorAll(`.an-q[data-k="${k}"] .an-opt`).forEach(b => b.classList.toggle('is-on', b.dataset.v === v));
  $('#go').disabled = !need().every(k => ans[k]);
}
async function post(url, body) {
  await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  load();
}
function submit() {
  if (!cur || !need().every(k => ans[k])) return;
  post('/api/label', {kind: cur.kind, id: cur.id, answer: ans});
}
async function load() {
  st = await (await fetch('/api/state')).json();
  cur = st.next; ans = {};
  render();
}
document.addEventListener('keydown', e => {
  if (!cur || e.metaKey || e.ctrlKey) return;
  if (e.key === 'Enter') return submit();
  const n = parseInt(e.key, 10); if (!n) return;
  const k = need().find(k => !ans[k]) || need()[need().length - 1];
  const b = document.querySelectorAll(`.an-q[data-k="${k}"] .an-opt`)[n - 1];
  b && pick(k, b.dataset.v);
});
load();
</script>
</body>
</html>
