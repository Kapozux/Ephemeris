<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Labeling</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1e1e1c; --mute:#6f6b63; --line:#e2dfd8; --you:#eef3fb; --ai:#f4f2ec;
          --acc:#2f5fb3; --on:#fff; --warn:#a4561b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#212125; --ink:#e8e6e1; --mute:#9a968e; --line:#34343a; --you:#1f2a3b; --ai:#26262b;
            --acc:#7ea6ec; --on:#111; --warn:#e0a060; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "Segoe UI", sans-serif; }
  .lb-top { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; z-index:1; }
  .lb-meta { color:var(--mute); font-size:13px; }
  .lb-bar { height:4px; background:var(--line); border-radius:2px; margin-top:8px; }
  .lb-bar i { display:block; height:100%; background:var(--acc); border-radius:2px; }
  .lb-main { max-width:820px; margin:0 auto; padding:16px; }
  .lb-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .lb-intro { font-size:14px; color:var(--mute); }
  .lb-msg { border-radius:8px; padding:8px 12px; margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
  .lb-msg.is-human { background:var(--you); }
  .lb-msg.is-assistant { background:var(--ai); }
  .lb-msg.is-target { outline:2px solid var(--acc); }
  .lb-msg.is-ctx { opacity:.6; font-size:13px; }
  .lb-who { font-size:12px; color:var(--mute); display:block; }
  .lb-q { margin-top:16px; }
  .lb-q p { margin:0 0 6px; font-weight:600; }
  .lb-q small { display:block; color:var(--mute); font-weight:normal; margin:-4px 0 8px; }
  .lb-opt { font:inherit; padding:7px 14px; margin:0 6px 6px 0; border:1px solid var(--line); border-radius:7px;
            background:var(--card); color:var(--ink); cursor:pointer; }
  .lb-opt.is-on { background:var(--acc); color:var(--on); border-color:var(--acc); }
  .lb-row { display:flex; gap:8px; justify-content:space-between; margin-top:18px; align-items:center; flex-wrap:wrap; }
  .lb-go { font:inherit; padding:8px 20px; border:0; border-radius:7px; background:var(--acc); color:var(--on); cursor:pointer; }
  .lb-go:disabled { opacity:.4; cursor:default; }
  .lb-link { font:inherit; background:none; border:0; color:var(--mute); cursor:pointer; text-decoration:underline; padding:0; }
  .lb-ans { font-size:14px; margin:8px 0; }
  .lb-ans b { font-weight:600; }
  .lb-done { text-align:center; padding:32px 16px; color:var(--mute); }
</style>
</head>
<body>
<div class="lb-top">
  <b>Blind labeling</b> <span class="lb-meta" id="head"></span>
  <div class="lb-bar"><i id="bar"></i></div>
</div>
<div class="lb-main" id="app">Loading…</div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WHO = {human:'Participant', assistant:'AI'};
const who = new URLSearchParams(location.search).get('a');
let st = null, cur = null, ans = {}, ms = 0, since = null;

// time on the item while the tab is in front
function clockStart() { ms = 0; since = document.hidden ? null : performance.now(); }
function clockNow() { return ms + (since ? performance.now() - since : 0); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden && since) { ms += performance.now() - since; since = null; }
  else if (!document.hidden && !since) since = performance.now();
});

function bubbles(it) {
  return it.msgs.map((m, i) => {
    const cls = it.target === null ? '' : i === it.target ? 'is-target' : 'is-ctx';
    return `<div class="lb-msg is-${m.role} ${cls}"><span class="lb-who">${WHO[m.role] || esc(m.role)}</span>${esc(m.text)}</div>`;
  }).join('');
}
function question(q) {
  return `<div class="lb-q" data-k="${esc(q.key)}"><p>${esc(q.text)}</p>${q.help ? `<small>${esc(q.help)}</small>` : ''}` +
    q.options.map(([v, t], i) => `<button class="lb-opt" data-v="${esc(v)}">${i + 1}. ${esc(t)}</button>`).join('') + '</div>';
}
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({a: who, ...body})});
  if (!r.ok) alertBox((await r.json().catch(() => ({}))).error || 'Not saved');
}
function alertBox(t) { const b = $('#err'); if (b) b.textContent = t; }

function render() {
  const cb = st.codebook;
  $('#head').textContent = `· ${who} · round ${st.round} of ${st.rounds} · ${st.done}/${st.total} · codebook ${cb.version}`;
  $('#bar').style.width = (st.total ? 100 * st.done / st.total : 0) + '%';
  const undo = st.last ? '<button class="lb-link" id="undo">Undo last</button>' : '<span></span>';
  let h = `<div class="lb-card lb-intro">${esc(cb.intro)}</div>`;
  if (!cur) {
    h += `<div class="lb-card"><div class="lb-done">Round ${st.round} done. ` + (st.discuss
      ? `Everyone has finished this round. <button class="lb-link" id="disc">Discuss the disagreements</button>`
      : `The others are still labeling; disagreements open once everyone is done.`) +
      `</div><div class="lb-row">${undo}</div></div>`;
    $('#app').innerHTML = h;
  } else {
    const qs = cb.questions.filter(q => cur.needs.includes(q.key));
    h += `<div class="lb-card"><div class="lb-meta">${esc(cur.source)} · ${cur.msgs.length} messages` +
      (cur.target === null ? '' : ' · label the outlined message; the faded ones are context') + `</div>` +
      bubbles(cur) + qs.map(question).join('') +
      `<div class="lb-row">${undo}<span class="lb-meta" id="err"></span><button class="lb-go" id="go" disabled>Next ⏎</button></div></div>`;
    $('#app').innerHTML = h;
    document.querySelectorAll('.lb-q').forEach(g => g.addEventListener('click', e => {
      const b = e.target.closest('.lb-opt'); if (b) pick(g.dataset.k, b.dataset.v);
    }));
    $('#go').onclick = submit;
    clockStart();
  }
  $('#undo') && ($('#undo').onclick = async () => { await post('/api/undo', {}); load(); });
  $('#disc') && ($('#disc').onclick = discuss);
  window.scrollTo(0, 0);
}
function pick(k, v) {
  ans[k] = v;
  document.querySelectorAll(`.lb-q[data-k="${k}"] .lb-opt`).forEach(b => b.classList.toggle('is-on', b.dataset.v === v));
  $('#go').disabled = !cur.needs.every(k => ans[k]);
}
async function submit() {
  if (!cur || !cur.needs.every(k => ans[k])) return;
  await post('/api/label', {id: cur.id, answers: ans, ms: Math.round(clockNow())});
  load();
}
async function load() {
  const r = await fetch('/api/state?a=' + encodeURIComponent(who || ''));
  if (!r.ok) return pickName();
  st = await r.json(); cur = st.next; ans = {};
  render();
}
async function pickName() {
  const d = await (await fetch('/api/who')).json();
  $('#head').textContent = '· ' + d.task;
  $('#app').innerHTML = `<div class="lb-card">Who is labeling? Each annotator uses their own link and never sees the others' answers.
    <div class="lb-row" style="justify-content:flex-start">${d.annotators.map(a => `<a class="lb-opt" href="?a=${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></div>`;
}

// disagreements: only after everyone finished the round; model judgments are never shown
async function discuss() {
  const d = await (await fetch('/api/discuss?a=' + encodeURIComponent(who))).json();
  cur = null;
  const qs = Object.fromEntries(d.codebook.questions.map(q => [q.key, q]));
  const open = d.items.filter(x => !x.agreed).length;
  let h = `<div class="lb-card lb-intro">Round ${d.round}: ${d.items.length} disagreements, ${open} still open. Talk each one through and record
    what you agree on; this becomes the reference label. Then update the codebook (and its version) where the disagreement came
    from an unclear rule, before the next round. <button class="lb-link" id="back">Back</button></div>`;
  h += d.items.map((x, n) => {
    const q = qs[x.key], name = v => (q.options.find(o => o[0] === v) || [v, v])[1];
    return `<div class="lb-card" data-n="${n}"><div class="lb-meta">${esc(x.item.source)} · ${esc(q.text)}</div>${bubbles(x.item)}
      <div class="lb-ans">${Object.entries(x.answers).map(([a, v]) => `<b>${esc(a)}</b>: ${esc(name(v))}`).join(' · ')}</div>
      <div class="lb-q" data-id="${esc(x.item.id)}" data-k="${esc(x.key)}"><small>Agreed label:</small>` +
      q.options.map(([v, t]) => `<button class="lb-opt ${x.agreed === v ? 'is-on' : ''}" data-v="${esc(v)}">${esc(t)}</button>`).join('') +
      `</div></div>`;
  }).join('');
  $('#app').innerHTML = h;
  $('#back').onclick = load;
  document.querySelectorAll('.lb-q[data-id]').forEach(g => g.addEventListener('click', async e => {
    const b = e.target.closest('.lb-opt'); if (!b) return;
    await post('/api/agree', {id: g.dataset.id, key: g.dataset.k, value: b.dataset.v});
    g.querySelectorAll('.lb-opt').forEach(o => o.classList.toggle('is-on', o === b));
  }));
}
document.addEventListener('keydown', e => {
  if (!cur || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') return submit();
  const n = parseInt(e.key, 10); if (!n) return;
  const k = cur.needs.find(k => !ans[k]) || cur.needs[cur.needs.length - 1];
  const b = document.querySelectorAll(`.lb-q[data-k="${k}"] .lb-opt`)[n - 1];
  b && pick(k, b.dataset.v);
});
if (who) load(); else pickName();
</script>
</body>
</html>
